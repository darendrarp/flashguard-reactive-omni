[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.29"
optimizer = true
optimizer_runs = 200
via_ir = false

remappings = [
    "@reactive/=lib/reactive/",
    "@forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
lasna = "https://lasna-rpc.rnk.dev/"
base-sepolia = "https://sepolia.base.org"
unichain-sepolia = "https://sepolia.unichain.org"
